name: Promote Image (Retag, Never Rebuild)

# Manual, deliberate action — a human picks the exact already-verified image
# and the exact target environment. This workflow NEVER runs `docker build`;
# it only re-tags an existing image in Artifact Registry and opens a Pull
# Request bumping the target environment's values file. The actual merge
# (and therefore the actual deploy) still requires human review.
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to promote INTO"
        required: true
        type: choice
        options: [test, prod]
      image_tag:
        description: "The EXACT immutable tag to promote (e.g. sha-be04632). Copy this from apps/demo-app/values-dev.yaml (promoting to test) or values-test.yaml (promoting to prod) — never type it from memory."
        required: true
        type: string
      release_version:
        description: "Only for target_env=prod: a human-readable version alias (e.g. v1.2.0). Leave blank for test."
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

# Only ONE promotion into a given environment can run at a time. A second
# run targeting the SAME environment queues behind the first instead of
# racing it (cancel-in-progress: false — we never want to abort a promotion
# that's already mutating the registry/branch state midway through).
# A promotion to `test` and a promotion to `prod` can still run in parallel
# — they're different concurrency groups.
concurrency:
  group: promote-${{ inputs.target_env }}
  cancel-in-progress: false

env:
  PROJECT_ID: gke-prod-demo-001
  REGION: asia-south1
  REPO: demo-app

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # Check out the target branch directly, at whatever its TRUE current
      # tip is at the moment this job actually starts running (not whenever
      # it was queued) — this is what makes the later branch-off always
      # fast-forward-safe, even after waiting behind another promotion.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_env }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Guard rail: fail immediately and clearly if someone fat-fingers a tag
      # that was never actually built.
      - name: Verify the source tag actually exists, resolve digest
        id: verify
        run: |
          SOURCE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.REPO }}:${{ inputs.image_tag }}"
          echo "Checking $SOURCE ..."
          DIGEST=$(gcloud artifacts docker images describe "$SOURCE" --format='value(image_summary.digest)' 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            echo "::error::Tag '${{ inputs.image_tag }}' was not found in Artifact Registry. Nothing was promoted."
            exit 1
          fi
          echo "Found digest: $DIGEST"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Determine final tag
        id: final
        run: |
          if [ "${{ inputs.target_env }}" = "prod" ] && [ -n "${{ inputs.release_version }}" ]; then
            echo "tag=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Idempotency guard: if the target environment is ALREADY pointed at
      # this exact tag (and, for prod, this exact digest), there's nothing
      # to do — no pointless PR, no empty commit, no wasted registry retag.
      - name: Check whether target already matches this exact image
        id: check
        run: |
          VALUES_FILE="apps/demo-app/values-${{ inputs.target_env }}.yaml"
          CURRENT_TAG=$(grep -oP '(?<=tag: ")[^"]*' "$VALUES_FILE" | head -1)
          SKIP="false"
          if [ "$CURRENT_TAG" = "${{ steps.final.outputs.tag }}" ]; then
            if [ "${{ inputs.target_env }}" = "prod" ]; then
              CURRENT_DIGEST=$(grep -oP '(?<=digest: ")[^"]*' "$VALUES_FILE" | head -1)
              [ "$CURRENT_DIGEST" = "${{ steps.verify.outputs.digest }}" ] && SKIP="true"
            else
              SKIP="true"
            fi
          fi
          if [ "$SKIP" = "true" ]; then
            echo "::notice::${{ inputs.target_env }} already points at ${{ steps.final.outputs.tag }} — nothing to promote."
          fi
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

      # Only creates a human-readable ALIAS pointing at the exact same
      # digest — a retag, not a rebuild.
      - name: Create release alias tag (prod only)
        if: steps.check.outputs.skip == 'false' && inputs.target_env == 'prod' && inputs.release_version != ''
        run: |
          SOURCE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.REPO }}:${{ inputs.image_tag }}"
          ALIAS="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.REPO }}:${{ inputs.release_version }}"
          gcloud artifacts docker tags add "$SOURCE" "$ALIAS"

      - name: Bump the target values file (no rebuild — just a reference update)
        if: steps.check.outputs.skip == 'false'
        run: |
          VALUES_FILE="apps/demo-app/values-${{ inputs.target_env }}.yaml"
          sed -i "s/tag: .*/tag: \"${{ steps.final.outputs.tag }}\"/" "$VALUES_FILE"
          if [ "${{ inputs.target_env }}" = "prod" ]; then
            sed -i "s#digest: .*#digest: \"${{ steps.verify.outputs.digest }}\"#" "$VALUES_FILE"
          fi

      # Belt-and-suspenders on top of the skip check above: never commit if
      # the file genuinely didn't change.
      - name: Check for an actual diff
        id: diff
        if: steps.check.outputs.skip == 'false'
        run: |
          VALUES_FILE="apps/demo-app/values-${{ inputs.target_env }}.yaml"
          if git diff --quiet -- "$VALUES_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Branch name includes the run ID, so it is UNIQUE to this specific
      # workflow run — no collision with a branch left over from an earlier
      # (possibly failed) run, which is exactly what caused the
      # non-fast-forward error. `--force` is safe here specifically because
      # this branch name can only ever be reused by a RETRY of this SAME
      # run (same run_id) — nobody else will ever push to it.
      - name: Create branch, commit, and push
        id: push
        if: steps.check.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="promote/${{ inputs.target_env }}-${{ steps.final.outputs.tag }}-${{ github.run_id }}"
          VALUES_FILE="apps/demo-app/values-${{ inputs.target_env }}.yaml"
          git checkout -b "$BRANCH"
          git add "$VALUES_FILE"
          git commit -m "promote: ${{ inputs.target_env }} -> ${{ steps.final.outputs.tag }} (source: ${{ inputs.image_tag }})"
          git push --force origin "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      # Idempotent: if a PR for this exact branch already exists (e.g. this
      # step is being re-run after a later step failed previously), reuse
      # it instead of erroring out on a duplicate-PR GraphQL error.
      - name: Open (or reuse) the promotion Pull Request
        if: steps.check.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.push.outputs.branch }}"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH — reusing it, not creating a duplicate."
          else
            gh pr create \
              --base ${{ inputs.target_env }} \
              --head "$BRANCH" \
              --title "Promote to ${{ inputs.target_env }}: ${{ steps.final.outputs.tag }}" \
              --body "Promotes the already-built, already-scanned image \`${{ inputs.image_tag }}\` (digest \`${{ steps.verify.outputs.digest }}\`) into **${{ inputs.target_env }}**. No rebuild occurred — this is a retag/reference update only. Review the diff, then merge to deploy."
          fi
