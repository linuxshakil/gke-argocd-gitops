environment: prod

preSyncCheck:
  enabled: true

rollout:
  enabled: true
  steps:
    - setWeight: 20
    - pause: { duration: 60 }
    - setWeight: 50
    - pause: { duration: 120 }
    - setWeight: 100

image:
  tag: "v1.1.0"
  digest: "sha256:29987af3a4bf20d9582f49804c8e4928b3ec82f18d7807d2283ced7158880071"

replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  host: "prod.myahad.online"
  className: "gce"

podAnnotations:
  "prometheus.io/scrape": "true"
  "prometheus.io/port": "8080"
