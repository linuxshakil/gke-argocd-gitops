environment: prod

preSyncCheck:
  enabled: true

rollout:
  enabled: true
  steps:
    - setWeight: 20
    - pause: { duration: 60 }
    - setWeight: 50
    - pause: { duration: 120 }
    - setWeight: 100

image:
  tag: "v1.0.0"    # human-readable label, set by promote.yml — informational only once digest is set
  digest: ""       # e.g. "sha256:abc123..." — set by promote.yml; THIS is what actually gets pulled

replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  host: "yourdomain.com"
  className: "gce"

podAnnotations:
  "prometheus.io/scrape": "true"
  "prometheus.io/port": "8080"
