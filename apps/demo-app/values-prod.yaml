environment: prod

preSyncCheck:
  enabled: true

rollout:
  enabled: true
  steps:
    - setWeight: 20
    - pause: { duration: 60 }
    - setWeight: 50
    - pause: { duration: 120 }
    - setWeight: 100

image:
  tag: "v1.0.1"
  digest: "sha256:5ede4b332ce64412365b8becb88d911a68658030553f84e01dc043512d9ea4f0"

replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  host: "prod.myahad.online"
  className: "gce"

podAnnotations:
  "prometheus.io/scrape": "true"
  "prometheus.io/port": "8080"
